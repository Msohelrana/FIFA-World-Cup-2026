name: Backfill scorers

# Keeps Firestore match results + scorers in sync with the FIFA API.
# Runs on a schedule and can be triggered manually. Only touches matches
# finished within BACKFILL_HOURS so each run is light.
#
# One-time setup: add a repo secret FIREBASE_SERVICE_ACCOUNT containing the full
# JSON of a Firebase service-account key (Settings → Secrets and variables →
# Actions → New repository secret).
#
# Note: scheduled workflows only run from the repository's DEFAULT branch, so
# this file (and backfill-scorers.mjs / package.json) must be merged to it.

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: read

concurrency:
  group: backfill-scorers
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Write service account key
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > serviceAccount.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Backfill recent matches
        run: node backfill-scorers.mjs
        env:
          BACKFILL_HOURS: "48"
