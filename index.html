<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA World Cup 2026 — Fixtures</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- PWA: installable + theme colors -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WC 2026" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>

<body>
  <header class="hero">
    <div class="hero-btn-group">
      <button id="settingsBtn" type="button" class="admin-btn hero-settings-btn" hidden>⚙️<span class="btn-label"> Settings</span></button>
      <button id="userBtn" type="button" class="admin-btn hero-user-btn">👤<span class="btn-label"> Sign in</span></button>
    </div>
    <div class="hero-inner">
      <div class="hero-flex">
        <img class="wc-logo" src="icon.png" alt="World Cup 2026 logo">
        <div class="hero-text">
          <p class="kicker">USA · Canada · Mexico</p>
          <h1>FIFA World Cup 2026</h1>
          <p class="dates">11 June – 19 July 2026 · 48 teams · 104 matches</p>
        </div>
      </div>
      <div class="tournament-progress">
        <div class="tournament-progress-bar">
          <div class="tournament-progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <span class="tournament-progress-text" id="progressText">0 / 104 matches played</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <div class="filter-row">
        <div class="filter-group">
          <label for="teamSelect">Team</label>
          <select id="teamSelect">
            <option value="">All teams</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="dateSelect">Date</label>
          <select id="dateSelect">
            <option value="">All dates</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="tzSelect">Time zone</label>
          <select id="tzSelect"></select>
        </div>
        <button id="clearBtn" type="button">Reset</button>
      </div>
      <div class="view-toggle" role="tablist" aria-label="View mode">
        <button class="tab active" data-view="schedule" role="tab" aria-selected="true">Schedule</button>
        <button class="tab" data-view="groups" role="tab" aria-selected="false">Groups</button>
        <button class="tab" data-view="standings" role="tab" aria-selected="false">Standings</button>
        <button class="tab" data-view="bracket" role="tab" aria-selected="false">Bracket</button>
        <button class="tab" data-view="scorers" role="tab" aria-selected="false">Scorers</button>
        <button class="tab" data-view="predict" role="tab" aria-selected="false">Table Predict</button>
        <button class="tab" data-view="picks" role="tab" aria-selected="false">Match Predict</button>
      </div>
    </section>

    <section id="summary" class="summary" hidden></section>

    <section id="groupsView" class="groups-view" hidden></section>

    <section id="standingsView" class="standings-view" hidden></section>

    <section id="bracketView" class="bracket-view" hidden></section>

    <section id="scorersView" class="scorers-leaderboard-view" hidden></section>

    <section id="predictView" class="predict-view" hidden></section>

    <section id="picksView" class="picks-view" hidden></section>

    <section id="scheduleView" class="schedule-view"></section>
  </main>

  <footer>
    <p>Fixture data from public sources.Knockout matches will be updated as teams qualify.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
  <script src="fixtures.js"></script>
  <script src="third-place-matrix.js"></script>
  <script src="live-scores.js"></script>
  <script src="app.js"></script>
</body>

</html>
