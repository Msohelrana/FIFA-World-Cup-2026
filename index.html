<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA World Cup 2026 — Fixtures</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- PWA: installable + theme colors -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WC 2026" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>

<body>
  <header class="hero">
    <div class="hero-btn-group">
      <button id="settingsBtn" type="button" class="admin-btn hero-settings-btn" hidden>⚙️<span class="btn-label"> Settings</span></button>
      <button id="userBtn" type="button" class="admin-btn hero-user-btn">👤<span class="btn-label"> Sign in</span></button>
    </div>
    <div class="hero-inner">
      <div class="hero-flex">
        <img class="wc-logo" src="icon.png" alt="World Cup 2026 logo">
        <div class="hero-text">
          <p class="kicker">USA · Canada · Mexico</p>
          <h1>FIFA World Cup 2026</h1>
          <p class="dates">11 June – 19 July 2026 · 48 teams · 104 matches</p>
        </div>
      </div>
      <div class="tournament-progress">
        <div class="tournament-progress-bar">
          <div class="tournament-progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <span class="tournament-progress-text" id="progressText">0 / 104 matches played</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <div class="filter-row">
        <div class="filter-group">
          <label for="teamSelect">Team</label>
          <select id="teamSelect">
            <option value="">All teams</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="dateSelect">Date</label>
          <select id="dateSelect">
            <option value="">All dates</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="tzSelect">Time zone</label>
          <select id="tzSelect"></select>
        </div>
        <button id="clearBtn" type="button">Reset</button>
      </div>
      <div class="view-toggle" role="tablist" aria-label="View mode">
        <button class="tab active" data-view="schedule" role="tab" aria-selected="true">Schedule</button>
        <button class="tab" data-view="groups" role="tab" aria-selected="false">Groups</button>
        <button class="tab" data-view="standings" role="tab" aria-selected="false">Standings</button>
        <button class="tab" data-view="bracket" role="tab" aria-selected="false">Bracket</button>
        <button class="tab" data-view="scorers" role="tab" aria-selected="false">Scorers</button>
        <button class="tab" data-view="predict" role="tab" aria-selected="false">Table Predict</button>
        <button class="tab" data-view="picks" role="tab" aria-selected="false">Match Predict</button>
      </div>
    </section>

    <section id="summary" class="summary" hidden></section>

    <section id="groupsView" class="groups-view" hidden></section>

    <section id="standingsView" class="standings-view" hidden></section>

    <section id="bracketView" class="bracket-view" hidden></section>

    <section id="scorersView" class="scorers-leaderboard-view" hidden></section>

    <section id="predictView" class="predict-view" hidden></section>

    <section id="picksView" class="picks-view" hidden></section>

    <section id="scheduleView" class="schedule-view"></section>
  </main>

  <footer>
    <p>Fixture data from public sources.Knockout matches will be updated as teams qualify.</p>
  </footer>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="tab active" data-view="schedule" role="tab" aria-selected="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Schedule</span>
    </button>
    <button class="tab" data-view="groups" role="tab" aria-selected="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>Groups</span>
    </button>
    <button class="tab" data-view="standings" role="tab" aria-selected="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
      <span>Standings</span>
    </button>
    <button class="tab" data-view="bracket" role="tab" aria-selected="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      <span>Bracket</span>
    </button>
    <button class="tab" data-view="scorers" role="tab" aria-selected="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
      <span>Scorers</span>
    </button>
    <button class="tab" data-view="predict" role="tab" aria-selected="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>Predict</span>
    </button>
    <button class="tab" data-view="picks" role="tab" aria-selected="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      <span>Picks</span>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2"></script>
  <script src="fixtures.js"></script>
  <script src="third-place-matrix.js"></script>
  <script src="live-scores.js"></script>
  <script src="app.js"></script>
</body>

</html>
